services:
  - type: web
    name: x-workspace-demo
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-flash
      - key: AI_MAX_OUTPUT_TOKENS
        value: 2048
      - key: AI_REASONING_EFFORT
        value: low
      - key: AI_API_KEY
        sync: false
      - key: PUBLIC_DEMO
        value: "true"
